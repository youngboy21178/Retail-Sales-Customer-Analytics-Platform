[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataanalyst2"
version = "0.1.0"
description = "Olist E-commerce data analysis project"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "sqlalchemy",
    "psycopg2-binary",
    "python-dotenv",
    "pydantic",
    "pyyaml",
]

[tool.setuptools]
packages = ["App", "Config", "Cli"]